# =============================================================================
# Test configuration overrides
# =============================================================================

# -----------------------------------------------------------------------------
# JaCoCo coverage.
#
# The exec-file wiring (data-file location + reuse-data-file) lives in the
# maven-surefire-plugin config in pom.xml, so that the quarkus-jacoco extension
# and the jacoco-maven-plugin agent append to one shared exec file. Here we only
# keep the OpenAPI-generated sources out of the coverage the extension records.
# -----------------------------------------------------------------------------
quarkus.jacoco.excludes=**/generated/**
