# =============================================================================
# Test configuration overrides
# =============================================================================

# -----------------------------------------------------------------------------
# JaCoCo coverage — combine @QuarkusTest and plain unit-test coverage.
#
# The quarkus-jacoco extension installs the coverage agent in a way that
# understands the Quarkus test classloader (a vanilla jacoco agent reports 0%
# for classes loaded through it) and writes execution data to the default
# target/jacoco-quarkus.exec. The jacoco-maven-plugin (see pom.xml) renders the
# report from that file into target/site/jacoco. OpenAPI-generated sources are
# excluded from the coverage the extension records.
# -----------------------------------------------------------------------------
quarkus.jacoco.excludes=**/generated/**
