# =============================================================================
# Task Management PoC — Application Configuration
# Tech stack: Quarkus 3.8.6 / Axon Framework 4.9.3 / H2 in-memory / Quartz
# =============================================================================

# -----------------------------------------------------------------------------
# Application-level settings
# -----------------------------------------------------------------------------
# Default user group applied to a task when CreateTaskCommand carries no
# explicit group name. Injected into TaskResource via @ConfigProperty.
task.default-group=unassigned
app.environment=dev

# -----------------------------------------------------------------------------
# Data source — H2 in-memory
# Both the Axon JPA event store and the Panache read model / audit trail use
# the same H2 in-memory database. The database is created fresh on every
# application start and discarded on stop (PoC only — not production-grade).
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
# Named URL so multiple connections share the same in-memory instance.
quarkus.datasource.jdbc.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
# drop-and-create: schema is recreated on every start.
# Acceptable for a PoC; change to "validate" or "none" in production.
quarkus.hibernate-orm.database.generation=drop-and-create
# Set to true for SQL query tracing during development
quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------------
# Jandex index — include Axon Framework JARs so that Quarkus / Hibernate
# can discover the @Entity classes that Axon uses internally:
#
#   axon-eventsourcing:
#     - DomainEventEntry    — stores serialised domain events
#     - SnapshotEventEntry  — stores aggregate snapshots
#
#   axon-modelling:
#     - SagaEntry           — stores serialised saga state
#     - AssociationValueEntry — maps correlation values to saga IDs
#
# Without this, Hibernate would not create the required tables and Axon's
# JPA event store and saga store would fail at runtime.
# ---------------------------------------------------------------------------
quarkus.index-dependency.axon-messaging.group-id=org.axonframework
quarkus.index-dependency.axon-messaging.artifact-id=axon-messaging
quarkus.index-dependency.axon-eventsourcing.group-id=org.axonframework
quarkus.index-dependency.axon-eventsourcing.artifact-id=axon-eventsourcing
quarkus.index-dependency.axon-modelling.group-id=org.axonframework
quarkus.index-dependency.axon-modelling.artifact-id=axon-modelling

# ---------------------------------------------------------------------------
# Quarkus Scheduler — disabled intentionally
# ---------------------------------------------------------------------------
# We do NOT use Quarkus's managed scheduler (@Scheduled methods or the
# Quarkus Quartz CDI-managed lifecycle). Instead, AxonConfig creates and
# manages a standalone org.quartz.Scheduler directly via StdSchedulerFactory.
#
# This gives Axon's QuartzDeadlineManager full control over the scheduler
# lifecycle and avoids the Quarkus "no @Scheduled methods found" guard that
# prevents the Quarkus-managed scheduler from starting without annotated jobs.
#
# The quarkus-quartz Maven dependency is still present so that the Quartz
# library classes (Scheduler, Job, Trigger, etc.) are on the classpath.
quarkus.scheduler.enabled=false

# ---------------------------------------------------------------------------
# HTTP / REST
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors.enabled=true
# Comma-separated allowlist of trusted frontend origins.
app.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.origins=${app.cors.origins}
quarkus.http.cors.headers=Accept, Authorization, Content-Type, Origin, X-Requested-With
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.exposed-headers=Content-Disposition, Access-Control-Allow-Origin

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."eu.poc.taskmanagement".level=DEBUG
quarkus.log.category."org.axonframework".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId:-} spanId=%X{spanId:-} [%c{2.}] (%t) %s%e%n

# ---------------------------------------------------------------------------
# Health / metrics / OpenTelemetry
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.otel.enabled=true
quarkus.otel.resource.attributes=service.name=task-management-backend,service.version=1.0.0-SNAPSHOT,deployment.environment=${app.environment}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# =============================================================================
# Test profile overrides (active when quarkus.profile=test)
# =============================================================================
%test.quarkus.log.level=WARN
%test.quarkus.log.category."eu.poc.taskmanagement".level=DEBUG
%test.quarkus.otel.sdk.disabled=true
