<h2 mat-dialog-title>Create Task</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="task-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title *</mat-label>
      <input matInput formControlName="title" />
      <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Group</mat-label>
      <input matInput formControlName="groupName" placeholder="Leave empty for default group" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Deadline *</mat-label>
      <input matInput type="datetime-local" formControlName="deadline" />
      <mat-error *ngIf="form.get('deadline')?.hasError('required')">Deadline is required</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="submit()">Create</button>
</mat-dialog-actions>
