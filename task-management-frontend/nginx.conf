server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular HTML5 routing — fallback to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Angular hashes filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
